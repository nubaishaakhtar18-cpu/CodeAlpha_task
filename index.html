<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="translator-card">
    <h2>Language Translator</h2>

    <!-- Language Selectors -->
    <div class="controls">
      <select id="sourceLang">
        <option value="autodetect">Auto Detect</option>
        <option value="en" selected>English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ur">Urdu</option>
        <option value="zh">Chinese</option>
      </select>

      <button id="swapBtn" title="Swap languages">⇄</button>

      <select id="targetLang">
        <option value="es" selected>Spanish</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ur">Urdu</option>
        <option value="zh">Chinese</option>
      </select>
    </div>

    <!-- Text Areas -->
    <div class="text-boxes">
      <div class="box">
        <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
        <div class="box-actions">
          <button id="speakSourceBtn" title="Listen">🔊</button>
        </div>
      </div>

      <div class="box">
        <textarea id="targetText" placeholder="Translation will appear here..." readonly></textarea>
        <div class="box-actions">
          <button id="copyBtn" title="Copy text">📋</button>
          <button id="speakTargetBtn" title="Listen">🔊</button>
        </div>
      </div>
    </div>

    <!-- Translate Action -->
    <button id="translateBtn">Translate Text</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
